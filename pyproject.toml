[project]
name = "secureai-workspace"
version = "0.1.0"
description = "Security-engineering learning project: authn, authz, multi-tenancy, RLS, AI app security."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2.3",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
