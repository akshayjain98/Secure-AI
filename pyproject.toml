[project]
name = "secureai-workspace"
version = "0.1.0"
description = "Security-engineering learning project: authn, authz, multi-tenancy, RLS, AI app security."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2.3",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
    "fastapi>=0.163.2",
    "uvicorn>=0.30",
    "pyjwt>=2.9",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
